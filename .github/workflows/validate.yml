name: Validate and package Panoramix
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run package:site
      - uses: actions/upload-artifact@v4
        with:
          name: panoramix-siteground
          path: dist/panoramix-siteground.zip
          if-no-files-found: error
